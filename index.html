<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studynex | Academic Operating System</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..600,0..1&display=swap" rel="stylesheet" />
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--color-primary)",
                        "on-primary": "var(--color-on-primary)",
                        "primary-container": "var(--color-primary-container)",
                        "on-primary-container": "var(--color-on-primary-container)",
                        
                        secondary: "var(--color-secondary)",
                        "on-secondary": "var(--color-on-secondary)",
                        "secondary-container": "var(--color-secondary-container)",
                        
                        background: "var(--color-background)",
                        "on-background": "var(--color-on-background)",
                        
                        surface: "var(--color-surface)",
                        "on-surface": "var(--color-on-surface)",
                        "surface-variant": "var(--color-surface-variant)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        
                        "surface-container-lowest": "var(--color-surface-lowest)",
                        "surface-container-low": "var(--color-surface-low)",
                        "surface-container": "var(--color-surface-container)",
                        "surface-container-high": "var(--color-surface-high)",
                        "surface-container-highest": "var(--color-surface-highest)",
                        
                        outline: "var(--color-outline)",
                        "outline-variant": "var(--color-outline-variant)",
                        
                        error: "var(--color-error)",
                        "on-error": "var(--color-on-error)",
                        "error-container": "var(--color-error-container)",
                        "on-error-container": "var(--color-on-error-container)",

                        success: "var(--color-success)",
                        warning: "var(--color-warning)",
                        danger: "var(--color-error)"
                    },
                    borderRadius: {
                        "none": "var(--radius-none)",
                        "sm": "var(--radius-sm)",
                        "DEFAULT": "var(--radius-md)",
                        "md": "var(--radius-md)",
                        "lg": "var(--radius-lg)",
                        "xl": "var(--radius-xl)",
                        "2xl": "var(--radius-2xl)",
                        "full": "var(--radius-full)"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        "soft": "0 1px 2px rgba(0,0,0,0.03)",
                        "subtle": "0 2px 4px -1px rgba(0,0,0,0.02)",
                        "elevated": "0 4px 6px -1px rgba(0,0,0,0.04), 0 2px 4px -2px rgba(0,0,0,0.02)",
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-family: 'Material Symbols Outlined', fallback;
        }
        body {
            background-color: var(--color-background);
            color: var(--color-on-background);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }
    </style>
  </head>
  <body class="flex min-h-screen selection:bg-primary/20 selection:text-primary overflow-x-hidden">
    <div id="root" class="max-w-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
